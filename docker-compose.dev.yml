services:
  postgres:
    image: postgres:15-alpine
    container_name: devsecops-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: devsecops
      POSTGRES_DB: devsecops
    ports:
      - "5432:5432"
    volumes:
      - devsecops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devsecops-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devsecops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devsecops_postgres_data:
  devsecops_redis_data:
